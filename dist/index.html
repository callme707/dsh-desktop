<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #1a1e2c 0%, #10121b 100%);
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e6e9f2;
    }
    .card { text-align: center; padding: 0 24px; }
    .spinner {
      width: 42px; height: 42px; margin: 0 auto 20px;
      border: 3px solid rgba(77, 107, 254, .25);
      border-top-color: #4d6bfe;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: .3px; }
    p { margin-top: 10px; font-size: 13px; color: #9aa3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>DeepSeek Harness</h1>
    <p>正在启动本地服务（首次启动需要一点时间）…</p>
  </div>
</body>
</html>
