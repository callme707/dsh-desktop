[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness 的 Windows 桌面壳（Tauri 2 + WebView2）"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
